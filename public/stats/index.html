<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Forever Careers Visits</title>
<style>
  :root { --bg:#07090B; --card:#0F1318; --line:rgba(255,255,255,0.09); --text:#F4F6F8; --muted:#8A939E; --teal:#5FC9BF; --green:#34D38C; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif; -webkit-font-smoothing:antialiased; padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 22px 16px 50px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom: 20px; }
  .brand { font-size:21px; font-weight:800; } .brand span { color:var(--green); } .brand small { display:block; font-size:12.5px; font-weight:500; color:var(--muted); margin-top:2px; }
  .btn { font:inherit; font-size:14px; font-weight:700; padding:9px 13px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; }
  .seg { display:flex; gap:6px; margin-bottom:16px; }
  .seg button { font:inherit; font-size:14px; font-weight:700; padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; }
  .seg button.on { background:var(--teal); color:#06201D; border-color:var(--teal); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .stat b { display:block; font-size:30px; font-weight:800; } .stat span { font-size:13px; color:var(--muted); } .stat em { font-style:normal; font-size:12.5px; color:var(--teal); display:block; margin-top:4px; }
  .lab { font-size:12px; font-weight:700; color:var(--muted); margin:0 0 8px; letter-spacing:.06em; }
  .chart { display:flex; gap:3px; height:150px; align-items:stretch; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 10px; }
  .axis { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin:6px 2px 18px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .row span:last-child { color:var(--muted); }
  .note { font-size:12.5px; color:var(--muted); margin-top:14px; line-height:1.5; }
  .gate { max-width:420px; margin:14vh auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  .gate input { width:100%; font:inherit; font-size:15px; color:var(--text); background:#0A0D11; border:1px solid var(--line); border-radius:10px; padding:12px; margin:12px 0; }
  @media (max-width: 640px) { .stats { grid-template-columns:1fr 1fr 1fr; } .stat b { font-size:24px; } .grid2 { grid-template-columns:1fr; } }
  .mode-badge { display:inline-flex; align-items:center; gap:6px; margin-left:10px; padding:5px 10px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.06em; vertical-align:middle; }
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none">
  <div class="brand">Forever<span>Careers</span><small>Visits</small></div>
  <input id="keyIn" type="password" placeholder="Viewing key" autocomplete="off">
  <button class="btn" id="go" style="background:var(--teal);color:#06201D;border-color:var(--teal)">Open</button>
  <div id="err" style="color:#F59E8B;font-size:14px;margin-top:8px"></div>
</div>
<div id="app" class="wrap" style="display:none">
  <header><div class="brand">Forever<span>Careers</span><span class="mode-badge" style="background:rgba(95,201,191,.14);border:1px solid rgba(95,201,191,.55);color:#5FC9BF">📊 VISITS VIEWER</span><small>Website visits &middot; view only</small></div><button class="btn" id="ref">Refresh</button></header>
  <div class="seg"><button data-d="1">Today</button><button data-d="7">7 days</button><button data-d="30" class="on">30 days</button></div>
  <div class="stats" id="cards"></div>
  <div class="lab" id="chartLab">PAGE VIEWS PER DAY</div>
  <div class="chart" id="chart"></div>
  <div class="axis"><span id="ax0"></span><span>Today</span></div>
  <div class="grid2"><div class="box"><div class="lab">WHERE VISITORS COME FROM</div><div id="src"></div></div><div class="box"><div class="lab">MOST VIEWED PAGES</div><div id="pg"></div></div></div>
  <div class="grid2"><div class="box"><div class="lab">DEVICES</div><div id="dev"></div></div><div class="box"><div class="lab">COUNTRIES</div><div id="cty"></div></div></div>
  <p class="note">Anonymous totals only. Your own visits are not counted on devices where you have opened your founder, admin or this link. Times in UTC.</p>
</div>
<script>
(function(){
  try { localStorage.setItem('fc_nocount','1'); } catch(e){}
  var KS='fc_stats_k', key='', days=30, data=null;
  var u=new URL(location.href), kq=u.searchParams.get('k');
  if (kq) { try { localStorage.setItem(KS,kq); } catch(e){} u.searchParams.delete('k'); history.replaceState({},'',u.pathname); }
  try { key=kq||localStorage.getItem(KS)||''; } catch(e){ key=kq||''; }
  var $=function(id){ return document.getElementById(id); };
  var esc=function(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var NAMES={home:'Homepage',jobs:'Browse all roles',pricing:'Pricing',help:'Stuck? / CV help',games:'Games',newsletter:'Newsletter',testimonials:'Testimonials',wellbeing:'How are you?',news:'Forever News',academy:'Courses',legal:'Terms',direct:'Direct / typed in',instagram:'Instagram',ig:'Instagram',google:'Google',facebook:'Facebook',tiktok:'TikTok',linkedin:'LinkedIn',whatsapp:'WhatsApp',x:'X (Twitter)',phone:'Phone',computer:'Computer',tablet:'Tablet',GB:'United Kingdom',US:'United States'};
  var lab=function(t){ return NAMES[t]||t; };
  function merge(rows){ var m={}; rows.forEach(function(r){ (r||[]).forEach(function(x){ var k=lab(x[0]); m[k]=(m[k]||0)+x[1]; }); }); return Object.keys(m).map(function(k){ return [k,m[k]]; }).sort(function(a,b){ return b[1]-a[1]; }); }
  function list(el, rows){
    var tot=rows.reduce(function(a,r){ return a+r[1]; },0)||1;
    $(el).innerHTML = rows.length ? rows.slice(0,10).map(function(r){ return '<div class="row"><span>'+esc(r[0])+'</span><span>'+r[1]+' &middot; '+Math.round(r[1]/tot*100)+'%</span></div>'; }).join('') : '<div style="color:var(--muted);font-size:14px">No visits yet</div>';
  }
  function render(){
    var v=data, d=v.daily.slice(-days);
    var views=d.reduce(function(a,r){return a+r.views;},0), uniq=d.reduce(function(a,r){return a+r.uniques;},0);
    $('cards').innerHTML='<div class="stat"><b>'+v.today.uniques+'</b><span>Visitors today</span><em>'+v.today.views+' page views</em></div>'+
      '<div class="stat"><b>'+v.week.uniques+'</b><span>Last 7 days</span><em>'+v.week.views+' page views</em></div>'+
      '<div class="stat"><b>'+v.month.uniques+'</b><span>Last 30 days</span><em>'+v.month.views+' page views</em></div>';
    var mx=Math.max(1,Math.max.apply(null,d.map(function(r){return r.views;})));
    $('chart').innerHTML=d.map(function(r){ var h=Math.round(r.views/mx*100); return '<div title="'+r.date+': '+r.views+' views, '+r.uniques+' visitors" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:4px"><div style="height:'+Math.max(h,2)+'%;background:#5FC9BF;border-radius:4px 4px 0 0;opacity:'+(r.views?1:.25)+'"></div></div>'; }).join('');
    $('ax0').textContent=d[0].date; $('chartLab').textContent='PAGE VIEWS PER DAY ('+views+' views, '+uniq+' visitors in this period)';
    list('src', merge([v.sources])); list('pg', merge([v.pages])); list('dev', merge([v.devices])); list('cty', merge([v.countries]));
  }
  function load(){
    if(!key){ $('gate').style.display='block'; return; }
    fetch('/api/admin?view=visits&days=30',{headers:{'x-admin-key':key},cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(v){
      data=v; $('gate').style.display='none'; $('app').style.display='block'; render();
    }).catch(function(){ $('gate').style.display='block'; $('app').style.display='none'; $('err').textContent= key ? 'That key did not work.' : ''; });
  }
  $('go').onclick=function(){ key=$('keyIn').value.trim(); try{localStorage.setItem(KS,key);}catch(e){} load(); };
  $('ref').onclick=load;
  document.querySelectorAll('.seg button').forEach(function(b){ b.onclick=function(){ document.querySelectorAll('.seg button').forEach(function(x){ x.classList.toggle('on',x===b); }); days=+b.dataset.d; if(data) render(); }; });
  load();
})();
</script>
</body>
</html>
